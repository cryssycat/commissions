<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StarHub Commissions</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="hero glass">

<h1>
✨ Starsundae Commissions
</h1>

<p>
Bring your art dreams to life.
</p>

</header>



<section>

<h2>
Available Commissions
</h2>

  
<div id="commissionGrid"
class="commission-grid">

</div>

</section>





<section class="glass fees-section">


<h2>
Additional Fees
</h2>


<div class="fees">
<span>
+ Shading +$5
</span>

<span>
+ Complex Background $15
</span>


<span>
+ Complex Character Fee $10
</span>


<span>
+ Commercial Use $26-50
</span>


<span>
+ Rush Order $20
</span>


</div>


</section>






<section class="glass form-card">


<h2>
Commission Request
</h2>


<form id="commissionForm">


<input
name="name"
placeholder="Your Name"
required
>



<input
name="email"
placeholder="Discord"
required
>




<select name="commission">


<option>
Icon / Headshot
</option>

<option>
Half Body
</option>
 

<option>
Full Body
</option>
 

<option>
Weapon Design
</option>

  
<option>
Outfit Design
</option>
  

<option>
Reference Sheet
</option>

<option>
VTuber Logo
</option>

  

<option>
Watermark
</option>

<option>
Collar Design
</option>




</select>





<textarea
name="details"
placeholder="Tell me about your idea"
required>
</textarea>





<input
name="reference"
placeholder="Reference link (optional)"
>




<button type="submit">

Join Queue

</button>



</form>


<p id="message"></p>


</section>





<script src="script.js"></script>


</body>

</html>
