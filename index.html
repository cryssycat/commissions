<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StarHub Commissions</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="hero glass">

<h1>
✨ StarHub Commissions
</h1>

<p>
Bring your character dreams to life.
</p>

</header>



<section>

<h2>
Available Commissions
</h2>

  
<div id="commissionGrid"
class="commission-grid">

</div>

</section>





<section class="glass fees-section">


<h2>
Additional Fees
</h2>


<div class="fees">


<span>
+ Extra Character $10
</span>


<span>
+ Background $15
</span>


<span>
+ Detailed Outfit $10
</span>


<span>
+ Commercial Use
</span>


<span>
+ Rush Order $20
</span>


</div>


</section>






<section class="glass form-card">


<h2>
Commission Request
</h2>


<form id="commissionForm">


<input
name="name"
placeholder="Your Name"
required
>



<input
name="email"
placeholder="Email"
required
>




<select name="commission">


<option>
Chibi Character
</option>


<option>
Character Illustration
</option>


</select>





<textarea
name="details"
placeholder="Tell me about your idea"
required>
</textarea>





<input
name="reference"
placeholder="Reference link (optional)"
>




<button type="submit">

Join Queue

</button>



</form>


<p id="message"></p>


</section>





<script src="script.js"></script>


</body>

</html>
