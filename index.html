<header class="page-header">
  <h1>Commissions</h1>
  <p>Open slots • Prices vary • Contact for inquiries</p>
</header>

<main class="page-wrapper">

  <!-- COMMISSIONS RENDER HERE -->
  <section id="commission-container"></section>

  <!-- FORM -->
  <section class="glass section-card">

    <h2>Join Queue</h2>

    <form id="queueForm">
      <input name="name" placeholder="Name" required>
      <input name="type" placeholder="Commission Type" required>
      <textarea name="details" placeholder="Details" required></textarea>
      <input name="email" placeholder="Email (optional)">
      <button type="submit">Submit</button>
    </form>

    <p id="status"></p>
  </section>

</main>
