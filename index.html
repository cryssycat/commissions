<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Hub Commissions</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar glass">
  <h2>✨ Star Hub Commissions</h2>
</header>

<section class="container">

  <div class="glass-strong center stack" style="padding:40px; text-align:center;">
    <h1 class="glow">Live Commission Queue</h1>
    <p>Powered by Notion + Star Hub Worker</p>
  </div>

</section>

<section class="container">

  <h2>Available Commissions</h2>

  <div id="commissions" class="commission-grid grid-3"></div>

</section>

<script>
const API = "YOUR_WORKER_URL_HERE/api/commissions";

async function loadCommissions() {
  const res = await fetch(API);
  const data = await res.json();

  const container = document.getElementById("commissions");
  container.innerHTML = "";

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "commission-card card floating";

    card.innerHTML = `
      <h3>${item.name}</h3>
      <span class="price">$${item.price}</span>

      <div class="stack">
        <span class="tag">${item.type}</span>
        <span class="tag">${item.status}</span>
      </div>

      <p>${item.description}</p>

      <button class="btn btn-primary">Request</button>
    `;

    container.appendChild(card);
  });
}

loadCommissions();
</script>

</body>
</html>
